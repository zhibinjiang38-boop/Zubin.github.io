<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>eBay 授权结果</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      max-width: 760px;
      margin: 40px auto;
      padding: 20px;
      color: #222;
      line-height: 1.6;
    }
    .box {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 20px;
      background: #fafafa;
    }
    code {
      background: #f1f1f1;
      padding: 2px 6px;
      border-radius: 4px;
      word-break: break-all;
      display: inline-block;
      max-width: 100%;
    }
    textarea {
      width: 100%;
      min-height: 140px;
      margin-top: 10px;
      font-family: Consolas, monospace;
      font-size: 14px;
    }
    .ok { color: #0a7a2f; }
    .err { color: #b42318; }
    .muted { color: #666; }
    button {
      margin-top: 12px;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: #111827;
      color: #fff;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>eBay 授权结果</h2>
    <p id="status" class="muted">正在解析授权结果…</p>
    <div id="details"></div>
  </div>

  <script>
    (function () {
      const href = window.location.href;

      function escapeHtml(str) {
        return String(str || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function getParam(name) {
        const regex = new RegExp("[?&]" + name + "=([^&#]*)");
        const match = href.match(regex);
        return match ? decodeURIComponent(match[1]) : "";
      }

      const state = getParam("state");
      const expiresIn = getParam("expires_in");
      const error = getParam("error");
      const errorDescription = getParam("error_description");
      const code = getParam("code");

      const statusEl = document.getElementById("status");
      const detailsEl = document.getElementById("details");

      if (error) {
        statusEl.className = "err";
        statusEl.textContent = "授权失败。";
        detailsEl.innerHTML = `
          <p><strong>error:</strong> <code>${escapeHtml(error)}</code></p>
          <p><strong>error_description:</strong> <code>${escapeHtml(errorDescription)}</code></p>
        `;
        return;
      }

      if (!code) {
        statusEl.className = "err";
        statusEl.textContent = "未获取到授权 code。";
        detailsEl.innerHTML = `
          <p>当前页面地址：</p>
          <p><code>${escapeHtml(href)}</code></p>
        `;
        return;
      }

      statusEl.className = "ok";
      statusEl.textContent = "授权成功。请复制下面的 code，用于 Python 脚本换 token。";

      detailsEl.innerHTML = `
        <p><strong>state:</strong> <code>${escapeHtml(state)}</code></p>
        <p><strong>expires_in:</strong> <code>${escapeHtml(expiresIn)}</code></p>
        <p><strong>授权 code：</strong></p>
        <textarea id="codeBox" readonly>${escapeHtml(code)}</textarea>
        <button onclick="copyCode()">复制 code</button>
      `;
    })();

    function copyCode() {
      const box = document.getElementById("codeBox");
      box.select();
      box.setSelectionRange(0, 999999);
      document.execCommand("copy");
      alert("code 已复制");
    }
  </script>
</body>
</html>
